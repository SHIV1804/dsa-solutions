name: Trace POC
on: [push]
jobs:
  check-gdb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install GDB
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Compile Driver
        run: |
          cd problems/hash-map/two-sum
          g++ -g -o twosum driver.cpp
          ls -la twosum
      - name: Inspect nums with GDB
        run: |
          cd problems/hash-map/two-sum
          gdb -batch -ex "break main" -ex "run" -ex "next" -ex "next" -ex "print nums" ./twosum
