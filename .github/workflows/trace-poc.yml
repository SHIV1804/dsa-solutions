name: Trace POC
on:
  push:
  workflow_dispatch:
    inputs:
      problem_path:
        description: "Path to the problem directory (e.g. problems/hash-map/two-sum)"
        required: false
        default: "problems/hash-map/two-sum"
permissions:
  contents: write
jobs:
  check-gdb:
    runs-on: ubuntu-latest
    env:
      # Falls back to the two-sum path for ordinary push events, which
      # have no workflow_dispatch inputs. Manual "Run workflow" runs
      # can override this to point at a different problem.
      PROBLEM_PATH: ${{ github.event.inputs.problem_path || 'problems/hash-map/two-sum' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install GDB
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Compile Driver
        run: |
          cd "$PROBLEM_PATH"
          g++ -g -o twosum driver.cpp
          ls -la twosum
      - name: Inspect nums with GDB
        run: |
          cd "$PROBLEM_PATH"
          rm -f gdb_raw_trace.txt
          gdb -batch \
            -ex "set logging file gdb_raw_trace.txt" \
            -ex "set logging enabled on" \
            -ex "break solution.cpp:9" \
            -ex "break solution.cpp:11" \
            -ex "run" \
            -ex "print i" -ex "print nums[i]" -ex "print target - nums[i]" \
            -ex "continue" \
            -ex "print i" -ex "print nums[i]" -ex "print target - nums[i]" \
            -ex "continue" \
            -ex "print i" -ex "print nums[i]" -ex "print target - nums[i]" \
            -ex "continue" \
            -ex "print i" -ex "print complement" \
            ./twosum
          echo "--- gdb_raw_trace.txt contents ---"
          cat gdb_raw_trace.txt
      - name: Commit and push GDB trace
        run: |
          cd "$PROBLEM_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gdb_raw_trace.txt
          if git diff --staged --quiet; then
            echo "No changes to gdb_raw_trace.txt, skipping commit."
          else
            git commit -m "chore: update GDB raw trace output [skip ci]"
            git push
          fi
      - name: Compile Brute-Force Driver
        run: |
          cd "$PROBLEM_PATH"
          g++ -g -o bruteforce bruteforce_driver.cpp
          ls -la bruteforce
      - name: Inspect brute-force nested loop with GDB
        run: |
          cd "$PROBLEM_PATH"
          rm -f gdb_raw_trace_bruteforce.txt
          gdb -batch \
            -ex "set logging file gdb_raw_trace_bruteforce.txt" \
            -ex "set logging enabled on" \
            -ex "break bruteforce_driver.cpp:14" \
            -ex "break bruteforce_driver.cpp:15" \
            -ex "run" \
            -ex "print i" -ex "print j" -ex "print nums[i]" -ex "print nums[j]" \
            -ex "continue" \
            -ex "print i" -ex "print j" -ex "print nums[i]" -ex "print nums[j]" \
            -ex "continue" \
            -ex "print i" -ex "print j" -ex "print nums[i]" -ex "print nums[j]" \
            -ex "continue" \
            -ex "print i" -ex "print j" \
            ./bruteforce
          echo "--- gdb_raw_trace_bruteforce.txt contents ---"
          cat gdb_raw_trace_bruteforce.txt
      - name: Commit and push brute-force GDB trace
        run: |
          cd "$PROBLEM_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gdb_raw_trace_bruteforce.txt
          if git diff --staged --quiet; then
            echo "No changes to gdb_raw_trace_bruteforce.txt, skipping commit."
          else
            git commit -m "chore: update brute-force GDB raw trace output [skip ci]"
            git push
          fi
